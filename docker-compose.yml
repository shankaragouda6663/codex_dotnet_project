version: "3.9"
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: rxflow
      POSTGRES_PASSWORD: rxflow
      POSTGRES_DB: rxflow
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rxflow"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v24.1.7
    command:
      - redpanda
      - start
      - --overprovisioned
      - --smp
      - "1"
      - --memory
      - "1G"
      - --reserve-memory
      - "0M"
      - --node-id
      - "0"
      - --check=false
      - --kafka-addr
      - PLAINTEXT://0.0.0.0:9092
      - --advertise-kafka-addr
      - PLAINTEXT://redpanda:9092
    ports:
      - "9092:9092"

  rxflow-api:
    build:
      context: .
      dockerfile: RxFlow.Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Postgres: Host=postgres;Port=5432;Database=rxflow;Username=rxflow;Password=rxflow
      ConnectionStrings__Redis: redis:6379
      Kafka__BootstrapServers: redpanda:9092
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      redpanda:
        condition: service_started
    ports:
      - "8080:8080"